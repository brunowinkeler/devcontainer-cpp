# Dependabot cannot see the apt pins in apt-requirements-*.json nor the binary versions
# pinned as Dockerfile ARGs (ccache, probe-rs, Arm GNU Toolchain, CPM). Those are updated by
# hand; see the "Updating pinned versions" section in README.md.

version: 2
updates:
  # Features pinned in .devcontainer/devcontainer.json
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    groups:
      devcontainer-features:
        patterns: ["*"]

  # Digest-pinned ubuntu base image in .devcontainer/Dockerfile
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly

  # cmake, conan and gcovr in .devcontainer/requirements.in
  - package-ecosystem: pip
    directory: /.devcontainer
    schedule:
      interval: weekly
    groups:
      python-tools:
        patterns: ["*"]

  # Grouped so a week of action bumps arrives as one pull request, not one per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
