name: build-push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A vX.Y.Z tag publishes X.Y.Z, X.Y, X and latest; main only moves edge.
      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "list=${version},${version%.*},${version%%.*},latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "list=edge" >> "$GITHUB_OUTPUT"
          fi

      # Builds through the dev container CLI so the features land in the image metadata.
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/devcontainer-cpp
          imageTag: ${{ steps.tags.outputs.list }}
          push: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          runCmd: |
            bash test/smoke.sh
            bash test/presets.sh

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```dockerfile
            FROM ghcr.io/${{ github.repository_owner }}/devcontainer-cpp:${{ steps.tags.outputs.version }}
            ```

            Also published as `${{ steps.tags.outputs.list }}`.

            Full tool inventory for this release:
            [docs/TOOLS.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/TOOLS.md)
